  <!-- 右下角固定悬浮夜间模式按钮 -->
  <button id="dark-mode-toggle" class="dark-btn-fixed" mdui-tooltip="{content: '切换夜间模式', position: 'left'}">
    <i class="mdui-icon material-icons" id="dark-icon">brightness_4</i>
  </button>

  <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js"></script>
  <script>
    const toggleBtn = document.getElementById('dark-mode-toggle');
    const darkIcon = document.getElementById('dark-icon');
    
    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        darkIcon.innerText = 'brightness_7';
      } else {
        document.documentElement.classList.remove('dark');
        darkIcon.innerText = 'brightness_4';
      }
    }

    const savedTheme = localStorage.getItem('theme_dark') === 'true';
    applyTheme(savedTheme);

    toggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      darkIcon.innerText = isDark ? 'brightness_7' : 'brightness_4';
      localStorage.setItem('theme_dark', isDark);
    });
  </script>
