    <!-- OpenCC 纯前端繁简转换依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script>
      // 1. 简繁体切换逻辑（遍历文本节点，不破坏 DOM 与事件）
      (function() {
        const langBtn = document.getElementById('lang-toggle-btn');
        const langText = document.getElementById('lang-toggle-text');
        
        const defaultIsTraditional = false;
        let currentTarget = localStorage.getItem('theme_lang_target'); 

        // 建立转换器
        const converterS2T = OpenCC.Converter({ from: 'cn', to: 'hk' });
        const converterT2S = OpenCC.Converter({ from: 'hk', to: 'cn' });

        // 只遍历并转换页面中的文本节点
        function convertTextNodes(converter) {
          const walk = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
            {
              acceptNode: function(node) {
                // 跳过 SCRIPT、STYLE 节点以及按钮内部的文本，避免冲突
                const parentName = node.parentElement ? node.parentElement.tagName : '';
                if (['SCRIPT', 'STYLE', 'NOSCRIPT'].includes(parentName)) {
                  return NodeFilter.FILTER_REJECT;
                }
                if (node.parentElement && node.parentElement.id === 'lang-toggle-text') {
                  return NodeFilter.FILTER_REJECT;
                }
                return NodeFilter.FILTER_ACCEPT;
              }
            },
            false
          );

          let node;
          while ((node = walk.nextNode())) {
            if (node.nodeValue && node.nodeValue.trim().length > 0) {
              node.nodeValue = converter(node.nodeValue);
            }
          }
        }

        function applyLanguage(target) {
          if (!target) {
            // 默认状态
            langText.innerText = defaultIsTraditional ? '简' : '繁';
            return;
          }

          if (target === 'zh-TW') {
            langText.innerText = '简';
            convertTextNodes(converterS2T);
          } else if (target === 'zh-CN') {
            langText.innerText = '繁';
            convertTextNodes(converterT2S);
          }
        }

        // 初始化判断
        if (currentTarget) {
          applyLanguage(currentTarget);
        }

        if (langBtn) {
          langBtn.addEventListener('click', () => {
            const nowTarget = localStorage.getItem('theme_lang_target');
            let nextTarget;

            if (defaultIsTraditional) {
              // 默认繁体：点击切换到简体，再点切回繁体
              nextTarget = (nowTarget === 'zh-CN') ? 'zh-TW' : 'zh-CN';
            } else {
              // 默认简体：点击切换到繁体，再点切回简体
              nextTarget = (nowTarget === 'zh-TW') ? 'zh-CN' : 'zh-TW';
            }

            localStorage.setItem('theme_lang_target', nextTarget);
            location.reload(); // 重新加载页面即可平滑转换
          });
        }
      })();
    </script>

<script>
  (function () {
    function initBgm() {
      var bgmBtn = document.getElementById('bgm-toggle-btn');
      var bgmPlayer = document.getElementById('bgm-player');
      var bgmIcon = document.getElementById('bgm-icon');
      
      if (!bgmBtn || !bgmPlayer || !bgmIcon) return;

      var isAutoplay = true;

      // 切换状态更新函数
      function updateUI(isPlaying) {
        if (isPlaying) {
          bgmBtn.classList.add('bgm-playing');
          bgmIcon.textContent = 'music_note'; // 播放时显示音符
        } else {
          bgmBtn.classList.remove('bgm-playing');
          bgmIcon.textContent = 'volume_off'; // 静音/暂停时显示带斜杠的喇叭
        }
      }

      // 播放/暂停逻辑
      function togglePlay() {
        if (bgmPlayer.paused) {
          bgmPlayer.play().then(function () {
            updateUI(true);
          }).catch(function (err) {
            console.log('播放失败:', err);
          });
        } else {
          bgmPlayer.pause();
          updateUI(false);
        }
      }

      // 绑定按钮点击事件
      bgmBtn.addEventListener('click', function (e) {
        e.preventDefault();
        togglePlay();
      });

      // 处理自动播放
      if (isAutoplay) {
        var startPlay = function () {
          bgmPlayer.play().then(function () {
            updateUI(true);
          }).catch(function () {
            // 如果被浏览器策略拦截，等待用户第一次点击页面任何地方后静默触发
            var onFirstTouch = function () {
              bgmPlayer.play().then(function () {
                updateUI(true);
              });
              document.removeEventListener('click', onFirstTouch);
              document.removeEventListener('touchstart', onFirstTouch);
            };
            document.addEventListener('click', onFirstTouch);
            document.addEventListener('touchstart', onFirstTouch);
          });
        };

        startPlay();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initBgm);
    } else {
      initBgm();
    }
  })();
</script>


<style>
  /* 确保 Canvas 始终置顶、透明且不挡住页面交互 */
  #falling-canvas {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    pointer-events: none !important;
    z-index: 999999 !important; /* 最高层级 */
  }
</style>

<script>
  (function () {
    function initFallingEffect() {
      // 防止重复创建 canvas
      if (document.getElementById('falling-canvas')) return;

      var config = {
        type: 'sakura',
        count: 30
      };

      var canvas = document.createElement('canvas');
      canvas.id = 'falling-canvas';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('2d');
      var width = (canvas.width = window.innerWidth);
      var height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', function () {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      var particles = [];
      var particleCount = config.count;

      function Particle() {
        this.reset();
      }

      Particle.prototype.reset = function () {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 8 + 6;
        this.speedY = Math.random() * 1.2 + 0.8;
        this.speedX = Math.random() * 1 - 0.5;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 1.5;
        this.opacity = Math.random() * 0.5 + 0.5;
      };

      Particle.prototype.update = function () {
        this.y += this.speedY;
        this.x += Math.sin(this.y / 30) + this.speedX;
        this.rotation += this.rotationSpeed;

        if (this.y > height || this.x < -20 || this.x > width + 20) {
          this.reset();
          this.y = -10;
        }
      };

      Particle.prototype.draw = function () {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;

        if (config.type === 'snow') {
          // 雪花效果
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 4;
          ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
          ctx.fill();
        } else {
          // 樱花瓣效果
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
          ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
          ctx.fillStyle = '#ffb7c5';
          ctx.fill();
        }

        ctx.restore();
      };

      for (var i = 0; i < particleCount; i++) {
        var p = new Particle();
        p.y = Math.random() * height;
        particles.push(p);
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        for (var i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        requestAnimationFrame(render);
      }

      render();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initFallingEffect);
    } else {
      initFallingEffect();
    }
  })();
</script>
